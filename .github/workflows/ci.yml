name: CI

on:
  pull_request:
    # develop only: slices land on feat/v1 after a local green bar; the effort's one
    # PR into develop runs this once. No push run, and no browser tests in CI.
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          NPM_SOFTISTX_READ_TOKEN: ${{ secrets.NPM_TOKEN }}
      # lint, schema and generated-types checks, build, typecheck (bun check), unit tests, import-direction check, loader and main-bundle gzipped size budgets
      - run: bun run verify
